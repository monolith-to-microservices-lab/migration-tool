[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "migration-tool"
version = "0.1.0"
description = "Coordinator CLI for the initial data migration from the legacy monolith into the User and Sales microservices (Strangler Fig - step: initial snapshot)."
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=7.1",
    "ruff==0.16.8",
    "mypy==2.3.1",
]

[project.scripts]
migration-tool = "migration_tool.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["migration_tool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The live integration suite (tests/integration) is opt-in: run it explicitly
# with `pytest tests/integration`. It is skipped from the default run.
addopts = "-q --ignore=tests/integration"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "unit: fast, isolated, no real Kafka/Postgres/network",
    "integration: uses real services/Postgres (isolated test resources)",
    "e2e: full real stack, end-to-end",
    "slow: takes more than a few seconds",
    "failure: chaos/failure-injection scenario",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, bugbear, pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI/Typer declare dependencies and parameters as default-argument calls.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body", "typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.12"
files = ["migration_tool"]
warn_unused_ignores = true
warn_redundant_casts = true

[tool.coverage.run]
source = ["migration_tool"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
